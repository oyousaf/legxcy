<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title & Meta Description -->
    <title>Legxcy | High-Performance Electric Bikes</title>
    <meta
      name="description"
      content="Legxcy builds modern, high-performance electric bikes with cutting-edge technology, superior design, and exceptional power for both city commutes and adventure trails."
    />
    <meta
      name="keywords"
      content="electric bikes, e-bikes, high-performance, Legxcy, urban commuting, adventure, eco-friendly transportation, electric bicycles"

    <meta name="author" content="Legxcy" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://legxcy.uk/" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Preload the largest above-the-fold images (LCP) -->
    <link rel="preload" as="image" href="/hub.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/mid.webp" fetchpriority="high" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#003632" />

    <meta property="og:url" content="https://legxcy.uk/" />
    <meta property="og:site_name" content="Legxcy" />

      property="og:title"
      content="Legxcy | High-Performance Electric Bikes"
    />
    <meta
      property="og:description"
      content="Explore Legxcy's high-performance electric bikes, engineered for speed, comfort, and adventure."
    />
    <meta property="og:image" content="https://legxcy.uk/hero.webp" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@LegxcyBikes" />
    <meta
      name="twitter:title"
      content="Legxcy | High-Performance Electric Bikes"
    />
    <meta
      name="twitter:description"
      content="Explore Legxcy's high-performance electric bikes, engineered for speed, comfort, and adventure."
    />
    <meta name="twitter:image" content="https://legxcy.uk/hero.webp" />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

          {
            "@type": "WebSite",
            "name": "Legxcy",
            "url": "https://legxcy.uk/"

          {
            "@type": "Organization",
            "name": "Legxcy",

        ]

    <!-- PWA Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
